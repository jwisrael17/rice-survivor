<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>League Admin · Rice Survivor</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body class="dashboard-body admin-body"><header class="dash-nav"><a class="site-logo" href="/" aria-label="Rice Survivor home"><img src="assets/rice-survivor-logo.png" alt="Rice University Survivor"></a><a class="dash-link" id="back-link" href="/">← Back to league</a></header>
<main class="admin-shell"><section id="login-card" class="login-card"><p class="eyebrow dark"><span></span> Commissioner access</p><h1>League admin</h1><p>Enter the PIN you chose when this league was created.</p><form id="admin-login"><label>League code</label><input id="login-code" required maxlength="6"><label>Admin PIN</label><input id="login-pin" type="password" inputmode="numeric" required><button class="button">Open dashboard <span>↗</span></button></form><p id="login-message" role="status"></p></section>
<section id="admin-dashboard" hidden><div class="admin-heading"><div><p class="eyebrow dark"><span></span> Commissioner dashboard</p><h1 id="admin-title"></h1></div><label>Season status<select id="status-select"><option>Preseason</option><option>In progress</option><option>Merge</option><option>Finale</option><option>Complete</option></select></label></div><div class="admin-note">Score changes are saved immediately to <code>data/leagues.json</code>.</div><div class="admin-table" id="admin-table"></div></section>
</main><script type="module" src="admin.js"></script></body></html>
